name: Package

# Builds the Qt frontend and produces distributable artifacts for every
# supported platform. Unlike Regression (which only needs
# starlane-console and runs on every push), this compiles the full Qt UI
# and is comparatively slow, so on pull requests it's gated on paths that
# could actually affect the build.
on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "starlane-core/**"
      - "starlane-qt/**"
      - "snap/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:
  # Lets Release call this as a reusable workflow to build everything a tag
  # push should publish, without duplicating the whole build matrix there.
  workflow_call:
    inputs:
      version:
        description: >
          Release version (no "v" prefix) to embed in build artifacts that
          can't derive it themselves the way cmake/Version.cmake does (the
          snap's version: field). Leave unset for non-release builds.
        type: string
        required: false
        default: ""

env:
  # A wildcard patch version, since the exact same patch release isn't
  # always available for every host/arch combination at the same time
  # (e.g. 6.11.1 was missing for Windows while present for macOS).
  QT_VERSION: "6.11.*"
  # The CMake build type
  BUILD_TYPE: "RelWithDebInfo"

jobs:
  windows:
    name: Windows 10/11 (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Full history + tags: cmake/Version.cmake runs `git describe
          # --tags --exact-match`, which needs the tag itself to be present
          # (a release build's version depends on it) -- the default shallow
          # checkout doesn't fetch tags at all.
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.10.*
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"

      - name: Configure
        run: >
          cmake -S . -B build -GNinja
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DBUILD_SHARED_LIBS=ON
          -DSL_BUILD_CONSOLE=OFF -DSL_BUILD_GLK=OFF -DSL_BUILD_TOOLS=OFF -DSL_BUILD_C_WRAPPER=OFF

      - name: Build
        run: cmake --build build --target starlane

      - name: Assemble deployable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/starlane-core/starlane-core.dll dist/
          Copy-Item build/starlane-core/deps/pugixml/pugixml.dll dist/
          Copy-Item build/starlane-qt/starlane.exe dist/
          windeployqt --release dist/starlane.exe

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath starlane-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: starlane-windows-x86_64
          path: starlane-windows-x86_64.zip

  macos:
    name: macOS 15 (universal x86_64+arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Full history + tags: cmake/Version.cmake runs `git describe
          # --tags --exact-match`, which needs the tag itself to be present
          # (a release build's version depends on it) -- the default shallow
          # checkout doesn't fetch tags at all.
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtmultimedia"

      - name: Install Utilities
        run: >
          brew install -y imagemagick

      - name: Configure
        run: >
          cmake -S . -B build -GNinja
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DSL_BUILD_CONSOLE=OFF -DSL_BUILD_GLK=OFF -DSL_BUILD_TOOLS=OFF -DSL_BUILD_C_WRAPPER=OFF

      - name: Build
        run: cmake --build build --target starlane

      # macdeployqt's -dmg bundles Qt's frameworks/plugins into the .app and
      # wraps it in a .dmg in one step; the app and Qt itself are already
      # universal (both archs), so the result is too.
      - name: Deploy Qt and create .dmg
        run: "$QT_ROOT_DIR/bin/macdeployqt build/starlane-qt/starlane.app -dmg"

      - name: Rename artifact
        run: mv build/starlane-qt/starlane.dmg starlane-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: starlane-macos-universal
          path: starlane-macos-universal.dmg

  linux:
    name: ${{ matrix.name }} (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04
            slug: ubuntu-26.04
            image: ubuntu:26.04
            install_git: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
            install_deps: >
              apt-get install -y --no-install-recommends
              cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev dpkg-dev file libpugixml-dev
            package_cmd: cpack -G DEB
            artifact_glob: build/*.deb
          - name: Debian 13
            slug: debian-13
            image: debian:trixie
            install_git: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
            install_deps: >
              apt-get install -y --no-install-recommends
              cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev dpkg-dev file libpugixml-dev
            package_cmd: cpack -G DEB
            artifact_glob: build/*.deb
          - name: Fedora 44
            slug: fedora-44
            image: fedora:44
            install_git: dnf install -y git
            install_deps: dnf install -y cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtmultimedia-devel rpm-build pugixml-devel
            package_cmd: cpack -G RPM
            artifact_glob: build/*.rpm
          - name: openSUSE Tumbleweed
            slug: opensuse-tumbleweed
            image: opensuse/tumbleweed
            install_git: zypper --non-interactive install git
            # busybox-gawk (present in the base image) provides gawk and
            # conflicts with the real gawk package that rpm-build needs;
            # drop it first (tolerating its absence on other base images).
            install_deps: |
              zypper --non-interactive remove busybox-gawk || true
              zypper --non-interactive install cmake ninja gcc-c++ qt6-base-common-devel qt6-widgets-devel qt6-multimedia-devel rpm-build pugixml-devel
            package_cmd: cpack -G RPM
            artifact_glob: build/*.rpm
    steps:
      # actions/checkout needs git already present in the container, so
      # this has to run as a plain shell step before checkout, not after.
      - name: Install git
        run: ${{ matrix.install_git }}

      - uses: actions/checkout@v5
        with:
          submodules: true
          # Full history + tags: cmake/Version.cmake runs `git describe
          # --tags --exact-match`, which needs the tag itself to be present
          # (a release build's version depends on it) -- the default shallow
          # checkout doesn't fetch tags at all.
          fetch-depth: 0

      # actions/checkout only allowlists the checkout as a git
      # safe.directory for its own internal git operations; it doesn't
      # persist that for later steps in a container job (unlike host-runner
      # jobs, where the runner's own git config already covers this). Without
      # it, cmake/Version.cmake's `git describe` fails with "detected
      # dubious ownership" -- silently, since it's meant to fall back
      # quietly on a shallow/tagless checkout too -- and the package quietly
      # ends up versioned 0.0.0 instead of the release tag.
      - name: Allow git operations on the checked-out repo
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure
        run: >
          cmake -S . -B build -GNinja
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DSL_BUILD_CONSOLE=OFF -DSL_BUILD_GLK=OFF -DSL_BUILD_TOOLS=OFF -DSL_BUILD_C_WRAPPER=OFF
          -DSL_USE_SYSTEM_PUGIXML=ON

      - name: Build
        run: cmake --build build --target starlane

      # Doesn't bundle Qt -- the package declares a dependency on the
      # distro's own Qt6 runtime libraries instead (see
      # cmake/Packaging.cmake), detected automatically from what
      # `starlane` actually links against.
      - name: Package
        working-directory: build
        run: ${{ matrix.package_cmd }}

      # CPack's default naming doesn't include the distro, so e.g. Ubuntu's
      # and Debian's .deb would otherwise both come out as
      # starlane_<version>_amd64.deb -- fine individually, but Release
      # later collects every job's file into one flat directory, where
      # that collision would silently drop one of them.
      - name: Rename package for release
        working-directory: build
        run: |
          for f in *.deb *.rpm; do
            [ -e "$f" ] || continue
            mv "$f" "starlane-${{ matrix.slug }}-x86_64.${f##*.}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: starlane-${{ matrix.slug }}-x86_64
          path: ${{ matrix.artifact_glob }}

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Full history + tags: cmake/Version.cmake runs `git describe
          # --tags --exact-match`, which needs the tag itself to be present
          # (a release build's version depends on it) -- the default shallow
          # checkout doesn't fetch tags at all.
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Qt's WASM build cross-compiles: moc/rcc/qmake etc. have to run
      # natively during the build, so a plain desktop Qt install of the
      # same version is required alongside the WASM one purely to supply
      # those host tools. Installing both under the same `dir` lays them
      # out as siblings (Qt/<version>/gcc_64 next to
      # Qt/<version>/wasm_singlethread), which is what lets the WASM
      # install's target_qt.conf resolve the host tools automatically --
      # `set-env: false` here keeps this call from clobbering the PATH/
      # QT_ROOT_DIR that the WASM install below sets up for the actual
      # build.
      - name: Install host Qt (for WASM cross-build tools)
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          dir: ${{ github.workspace }}/qt
          set-env: false

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          dir: ${{ github.workspace }}/qt

      # Must match the Emscripten version Qt itself was built against
      # (see https://doc.qt.io/qt-6/wasm.html) -- a mismatched version
      # tends to fail in confusing ways deep inside Qt's own WASM glue
      # code rather than with a clear version-check error up front.
      - name: Install matching Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "4.0.7"

      # starlane-core's expression grammar is compiled by packcc (see
      # starlane-core/CMakeLists.txt) -- a build-time code generator, not
      # part of the shipped product, so it has to run on the CI host, not
      # under Emscripten. A native host configure exports its location via
      # ImportExecutables.cmake (EXPORT(TARGETS packcc ...), only emitted
      # when NOT cross-compiling), which the WASM configure below then
      # imports via IMPORT_EXECUTABLES instead of trying to build packcc
      # itself.
      - name: Configure and build host packcc
        run: |
          cmake -S . -B build-host -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSL_BUILD_QT=OFF -DSL_BUILD_CONSOLE=OFF -DSL_BUILD_GLK=OFF -DSL_BUILD_TOOLS=OFF -DSL_BUILD_C_WRAPPER=OFF
          cmake --build build-host --target packcc

      - name: Configure
        run: >
          cmake -S . -B build -GNinja
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DCMAKE_TOOLCHAIN_FILE="${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake"
          -DIMPORT_EXECUTABLES="${{ github.workspace }}/build-host/ImportExecutables.cmake"
          -DSL_BUILD_CONSOLE=OFF -DSL_BUILD_GLK=OFF -DSL_BUILD_TOOLS=OFF -DSL_BUILD_C_WRAPPER=OFF

      - name: Build
        run: cmake --build build --target starlane

      # starlane.html is Qt's default app shell; renamed to index.html so
      # it serves directly at whatever path this bundle is unpacked under
      # (see the Pages job in release.yml, which unpacks it to app/).
      - name: Assemble WASM bundle
        run: |
          mkdir -p dist
          cp build/starlane-qt/starlane.html dist/index.html
          cp build/starlane-qt/starlane.js build/starlane-qt/starlane.wasm build/starlane-qt/qtloader.js build/starlane-qt/qtlogo.svg dist/
          (cd dist && zip -r ../starlane-wasm.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: starlane-wasm
          path: starlane-wasm.zip

  snap:
    name: Snap (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Full history + tags: cmake/Version.cmake runs `git describe
          # --tags --exact-match`, which needs the tag itself to be present
          # (a release build's version depends on it) -- the default shallow
          # checkout doesn't fetch tags at all.
          fetch-depth: 0

      # snapcraft.yaml's version: field is static, unlike CMake's (which
      # derives it from the tag itself via cmake/Version.cmake) -- patch it
      # in directly when Release passes one through.
      - name: Set snap version from release tag
        if: inputs.version != ''
        run: |
          sed -i "s/^version: .*/version: '${{ inputs.version }}'/" snap/snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: snapcraft

      - uses: actions/upload-artifact@v4
        with:
          name: starlane-snap-x86_64
          path: ${{ steps.snapcraft.outputs.snap }}
